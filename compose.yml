name: ollama

services:
  app:
    image: ollama/ollama
    restart: always
    ports:
      - $APP_PORT:11434
    volumes:
      - ./data:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NEW_ENGINE: 1
      OLLAMA_CONTEXT_LENGTH: 64000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
