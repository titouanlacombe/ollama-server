name: ollama

services:
  app:
    image: ollama/ollama
    restart: always
    ports:
      - $APP_PORT:11434
    volumes:
      - ./data:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
    networks:
      - ollama
    hostname: ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

networks:
  ollama:
    name: ollama
    driver: bridge
